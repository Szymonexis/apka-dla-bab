[package]
name = "ogarniaczka"
version = "0.2.0"
description = "Ogarniaczka - domowy organizer (Tauri 2 + Svelte 5)"
edition = "2021"

# Biblioteka jest potrzebna, żeby Tauri mogło budować wersje mobilne
# (Android/iOS linkują apkę jako lib), a main.rs zostaje cienkim wrapperem.
[lib]
name = "ogarniaczka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
