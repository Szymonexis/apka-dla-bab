services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baba}
      POSTGRES_DB: ${POSTGRES_DB:-apka}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baba} -d ${POSTGRES_DB:-apka}"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # konsola webowa
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Self-hostowany serwer powiadomień push (open source, bez opłat).
  # Telefon subskrybuje swój sekretny temat w aplikacji ntfy (F-Droid/Google Play),
  # a nasz backend publikuje na niego przypomnienia i poranne podsumowania.
  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-http://localhost:8090}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      # push dociera także do telefonów bez usług Google
      NTFY_UPSTREAM_BASE_URL: ""
    ports:
      - "8090:80"
    volumes:
      - ntfydata:/var/cache/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:80/v1/health | grep -o '\"healthy\":true'"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ntfy:
        condition: service_started
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-baba}:${POSTGRES_PASSWORD:-baba}@postgres:5432/${POSTGRES_DB:-apka}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-zmien-mnie}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-apka-files}
      MINIO_USE_SSL: "false"
      NTFY_URL: http://ntfy:80
      NTFY_PUBLIC_URL: ${NTFY_PUBLIC_URL:-http://localhost:8090}
      TIMEZONE: ${TIMEZONE:-Europe/Warsaw}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
  ntfydata:
